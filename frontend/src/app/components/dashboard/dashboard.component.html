<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">Case Itaú Node.js</a>
    <div class="d-flex" *ngIf="!hasApiUrl">
        <input class="form-control me-2" [(ngModel)]="tempUrl" placeholder="http://localhost:3000">
        <button class="btn btn-light" (click)="setUrl()">Set URL</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Clients</h2>
    <button class="btn btn-primary" (click)="openCreateClientModal()">
      <i class="bi bi-plus-lg"></i> New Client
    </button>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Balance</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let client of clients">
              <td>{{ client.nome }}</td>
              <td>{{ client.email }}</td>
              <td class="fw-bold" [class.text-success]="client.saldo > 0" [class.text-danger]="client.saldo < 0">
                {{ client.saldo | currency:'BRL' }}
              </td>
              <td class="text-end">
                <div class="btn-group btn-group-sm me-2">
                  <button class="btn btn-outline-success" (click)="openTransactionModal(client, 'deposit')" title="Deposit">
                    <i class="bi bi-arrow-down-circle"></i>
                  </button>
                  <button class="btn btn-outline-danger" (click)="openTransactionModal(client, 'withdraw')" title="Withdraw">
                    <i class="bi bi-arrow-up-circle"></i>
                  </button>
                  <button class="btn btn-outline-primary" (click)="openTransferModal(client)" title="Transfer">
                    <i class="bi bi-arrow-right-circle"></i>
                  </button>
                  <button class="btn btn-outline-info" (click)="openStatementModal(client)" title="Statement">
                    <i class="bi bi-list-ul"></i>
                  </button>
                </div>
                <div class="btn-group btn-group-sm">
                  <button class="btn btn-outline-secondary" (click)="openEditClientModal(client)" title="Edit">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-outline-danger" (click)="deleteClient(client)" title="Delete">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="clients.length === 0 && !error">
              <td colspan="4" class="text-center py-4 text-muted">
                No clients found. Create one to get started.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<app-client-modal
  [isVisible]="isClientModalVisible"
  [client]="selectedClient"
  (save)="onSaveClient($event)"
  (cancel)="closeClientModal()">
</app-client-modal>

<app-transaction-modal
  [isVisible]="isTransactionModalVisible"
  [client]="selectedClient"
  [type]="transactionType"
  (confirm)="onTransactionConfirm($event)"
  (cancel)="closeTransactionModal()">
</app-transaction-modal>

<app-transfer-modal
  [isVisible]="isTransferModalVisible"
  [sender]="selectedClient"
  [clients]="clients"
  (confirm)="onTransferConfirm($event)"
  (cancel)="closeTransferModal()">
</app-transfer-modal>

<app-statement-modal
  [isVisible]="isStatementModalVisible"
  [client]="selectedClient"
  (close)="closeStatementModal()">
</app-statement-modal>
