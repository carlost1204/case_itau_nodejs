<div class="modal-backdrop fade show" *ngIf="isVisible"></div>
<div class="modal fade show d-block" tabindex="-1" *ngIf="isVisible">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Statement for {{ client?.nome }}</h5>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="loading" class="text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div *ngIf="error" class="alert alert-danger">
          {{ error }}
        </div>

        <div *ngIf="!loading && !error">
          <div *ngIf="transactions.length === 0" class="text-center text-muted">
            No transactions found.
          </div>

          <table class="table table-striped" *ngIf="transactions.length > 0">
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let tx of transactions">
                <td>{{ tx.createdAt | date:'medium' }}</td>
                <td>
                  <span class="badge text-white" [ngClass]="{
                    'bg-success': tx.type === 'DEPOSIT' || tx.type === 'TRANSFER_RECEIVED',
                    'bg-danger': tx.type === 'WITHDRAW' || tx.type === 'TRANSFER_SENT'
                  }">
                    {{ tx.type }}
                  </span>
                </td>
                <td [ngClass]="{
                  'text-success': tx.type === 'DEPOSIT' || tx.type === 'TRANSFER_RECEIVED',
                  'text-danger': tx.type === 'WITHDRAW' || tx.type === 'TRANSFER_SENT'
                }">
                  {{ (tx.type === 'WITHDRAW' || tx.type === 'TRANSFER_SENT' ? '-' : '+') }}
                  {{ tx.amount | currency:'BRL' }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Close</button>
      </div>
    </div>
  </div>
</div>
