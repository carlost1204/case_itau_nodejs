<div class="modal-backdrop fade show" *ngIf="isVisible"></div>
<div class="modal fade show d-block" tabindex="-1" *ngIf="isVisible">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Transfer from {{ sender?.nome }}</h5>
        <button type="button" class="btn-close" (click)="onCancel()"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="receiver" class="form-label">To Client</label>
            <select class="form-select" id="receiver" [(ngModel)]="receiverId" name="receiver" required>
              <option value="" disabled selected>Select a recipient</option>
              <option *ngFor="let client of clients" [value]="client.id" [disabled]="client.id === sender?.id">
                {{ client.nome }} ({{ client.email }})
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="amount" [(ngModel)]="amount" name="amount" required min="0.01" step="0.01">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="!receiverId || amount <= 0">
          Transfer
        </button>
      </div>
    </div>
  </div>
</div>
